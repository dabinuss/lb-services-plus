<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MapPlus – Debug & Mathematical Calibration</title>
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <link rel="stylesheet" href="map.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0b0d; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; }

        .hud-overlay {
            position: absolute; top: 16px; left: 16px; z-index: 1000;
            background: rgba(20,22,26,0.94); color: #fff; padding: 14px 18px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            max-width: 300px;
        }
        .hud-title { font-weight: 800; font-size: 15px; color: #a742ff; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .hud-sub { font-size: 11px; color: #888; margin-bottom: 10px; }
        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .btn {
            background: rgba(255,255,255,0.08); color: #eee;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 5px 11px; border-radius: 6px; font-size: 11px; font-weight: 700;
            cursor: pointer; user-select: none;
        }
        .btn.active { background: #a742ff; color: #fff; border-color: #a742ff; }
        .btn.danger  { background: rgba(255,60,60,0.18); border-color: rgba(255,60,60,0.4); color: #ff8080; }

        .cal-panel {
            position: absolute; top: 16px; right: 16px; z-index: 1000;
            background: rgba(20,22,26,0.94); color: #fff; padding: 14px 16px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            min-width: 280px; max-height: calc(100vh - 40px); overflow-y: auto; display: none;
        }
        .cal-panel.visible { display: block; }
        .cal-title { font-size: 12px; font-weight: 800; color: #f4b914; text-transform: uppercase; margin-bottom: 10px; }
        .cal-stats {
            background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px 10px;
            font-size: 11px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.08);
        }
        .cal-point {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
            font-size: 11px; cursor: pointer;
        }
        .cal-point:hover { color: #a742ff; }
        .cal-point-left { display: flex; align-items: center; gap: 8px; }
        .cal-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #555; border: 1.5px solid #888; flex-shrink: 0;
        }
        .cal-dot.ok   { background: #3fa84c; border-color: #3fa84c; }
        .cal-dot.warn { background: #f4b914; border-color: #f4b914; }
        .cal-dot.err  { background: #e04343; border-color: #e04343; }
        .cal-err-val  { font-size: 10px; font-weight: 700; font-family: monospace; }
        
        .crs-inputs { margin-top: 10px; }
        .crs-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11px; }
        .crs-row label { width: 58px; color: #888; }
        .crs-row input {
            width: 90px; background: rgba(255,255,255,0.06); color: #fff;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
            padding: 3px 6px; font-size: 11px;
        }
        .crs-apply { width: 100%; margin-top: 8px; background: #a742ff; color: #fff; border: none; border-radius: 6px; padding: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .btn-least-squares { width: 100%; margin-top: 6px; background: #28a745; color: #fff; border: none; border-radius: 6px; padding: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="hud-overlay">
        <div class="hud-title">MapPlus Debug</div>
        <div class="hud-sub">Mathematical Least-Squares Calibration & Residuals</div>
        <div class="btn-row">
            <button class="btn active" onclick="switchStyle('styleAtlas')">Atlas</button>
            <button class="btn" onclick="switchStyle('styleGrid')">Grid</button>
        </div>
        <div class="btn-row">
            <button class="btn" onclick="toggleCalibration()">⊕ Calibration Tool</button>
        </div>
        <div class="btn-row">
            <button class="btn" onclick="simulateRoute()">▶ Simulate Route (5m)</button>
            <button class="btn danger" onclick="clearAll()">✕ Clear</button>
        </div>
        <div id="crs-info" style="font-size:10px;color:#888;margin-top:6px;font-family:monospace;"></div>
    </div>

    <!-- Mathematical Calibration panel (right side) -->
    <div class="cal-panel" id="calPanel">
        <div class="cal-title">⊕ Calibration & Residuals</div>
        <div class="cal-stats" id="calStats">Measuring errors...</div>
        <div id="calList"></div>
        <div class="crs-inputs">
            <div style="font-size:10px;color:#888;margin-bottom:6px;">Current CRS transform:</div>
            <div class="crs-row"><label>scaleX</label><input id="i_sx" type="number" step="0.00001"></div>
            <div class="crs-row"><label>offsetX</label><input id="i_ox" type="number" step="0.1"></div>
            <div class="crs-row"><label>scaleY</label><input id="i_sy" type="number" step="0.00001"></div>
            <div class="crs-row"><label>offsetY</label><input id="i_oy" type="number" step="0.1"></div>
            <button class="crs-apply" onclick="applyCRS()">Apply & Re-Measure</button>
            <button class="btn-least-squares" onclick="solveLeastSquares()">⚡ Auto-Fit (Least-Squares)</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="leaflet/leaflet.js"></script>
    <script src="map.js"></script>
    <script>
        // ── Calibration reference dataset ─────────────────────────────────────────
        // Pairs GTA V world coordinates with reference Atlas tile projection points
        const CAL_DATASET = [
            { name: 'LSIA Runway',      gtaX: -1336.0, gtaY: -3044.0, targetPxX: 89.62, targetPxY: 235.20 },
            { name: 'Legion Square',    gtaX:   195.6, gtaY:  -933.9, targetPxX: 121.35, targetPxY: 191.95 },
            { name: 'Vespucci Beach',   gtaX:  -1178.0, gtaY: -1571.0, targetPxX: 92.89, targetPxY: 205.00 },
            { name: 'Del Perro Pier',   gtaX:  -1670.0, gtaY:  -887.0, targetPxX: 82.69, targetPxY: 190.98 },
            { name: 'Vinewood Sign',    gtaX:   487.7, gtaY:  1103.8, targetPxX: 127.40, targetPxY: 150.17 },
            { name: 'Sandy Shores',     gtaX:  1994.0, gtaY: 3745.0, targetPxX: 158.62, targetPxY: 96.03 },
            { name: 'Grapeseed',        gtaX:  2624.0, gtaY: 5002.0, targetPxX: 171.67, targetPxY: 70.26 },
            { name: 'Paleto Bay',       gtaX:  -105.0, gtaY: 6270.0, targetPxX: 115.12, targetPxY: 44.27 },
            { name: 'Chumash / PCH',    gtaX: -3040.0, gtaY:  130.0, targetPxX: 54.31, targetPxY: 170.13 },
            { name: 'Mt Chiliad Peak',  gtaX:   502.0, gtaY: 5604.0, targetPxX: 127.70, targetPxY: 57.92 },
        ];

        const mapContainer = document.getElementById('map');

        const DebugRenderer = class extends MapPlusRenderer {
            constructor(container, opts) {
                super(container, opts);
                this.map.dragging.enable();
                this.map.scrollWheelZoom.enable();
                this.map.doubleClickZoom.enable();
                this.map.touchZoom.enable();
                this.map.keyboard.enable();
                this.map.setView([-933.9, 195.6], 3, { animate: false });
            }
        };

        let renderer = new DebugRenderer(mapContainer, { style: 'styleAtlas' });
        let calMarkers = [];
        let calVisible = false;
        let simInterval = null;

        function updateCRSInfo() {
            const t = window.GTA_MAP_TRANSFORM;
            document.getElementById('crs-info').textContent =
                `CRS: sx=${t.scaleX} ox=${t.offsetX} sy=${t.scaleY} oy=${t.offsetY}`;
        }
        updateCRSInfo();

        function syncInputs() {
            const t = window.GTA_MAP_TRANSFORM;
            document.getElementById('i_sx').value = t.scaleX;
            document.getElementById('i_ox').value = t.offsetX;
            document.getElementById('i_sy').value = t.scaleY;
            document.getElementById('i_oy').value = t.offsetY;
        }

        // Compute residuals (mean error and max error in pixels at zoom 3)
        function measureResiduals() {
            const t = window.GTA_MAP_TRANSFORM;
            let sumSq = 0;
            let sumLinear = 0;
            let maxErr = 0;
            const residuals = [];

            CAL_DATASET.forEach(pt => {
                const computedX = t.scaleX * pt.gtaX + t.offsetX;
                const computedY = t.scaleY * pt.gtaY + t.offsetY;
                const dx = (computedX - pt.targetPxX) * 8; // zoom 3 scale (2^3 = 8)
                const dy = (computedY - pt.targetPxY) * 8;
                const err = Math.hypot(dx, dy);
                if (err > maxErr) maxErr = err;
                sumLinear += err;
                sumSq += err * err;
                residuals.push(err);
            });

            const meanErr = sumLinear / CAL_DATASET.length;
            const rms = Math.sqrt(sumSq / CAL_DATASET.length);
            return { meanErr, maxErr, rms, residuals };
        }

        function toggleCalibration() {
            calVisible = !calVisible;
            document.getElementById('calPanel').classList.toggle('visible', calVisible);
            if (calVisible) {
                syncInputs();
                renderCalList();
                placeCalMarkers();
            } else {
                clearCalMarkers();
            }
        }

        function renderCalList() {
            const list = document.getElementById('calList');
            const stats = document.getElementById('calStats');
            list.innerHTML = '';

            const { meanErr, maxErr, rms, residuals } = measureResiduals();
            stats.innerHTML = `<b>Mean Error:</b> ${meanErr.toFixed(1)} px &nbsp;|&nbsp; <b>Max:</b> ${maxErr.toFixed(1)} px<br><span style="color:#888;">RMS Error: ${rms.toFixed(2)} px (Zoom 3)</span>`;

            CAL_DATASET.forEach((pt, i) => {
                const err = residuals[i];
                const dotClass = err < 3.0 ? 'ok' : (err < 7.0 ? 'warn' : 'err');
                const row = document.createElement('div');
                row.className = 'cal-point';
                row.innerHTML = `
                    <div class="cal-point-left">
                        <div class="cal-dot ${dotClass}"></div>
                        <span>${pt.name}<br><span style="color:#666;font-size:10px;">${pt.gtaX}, ${pt.gtaY}</span></span>
                    </div>
                    <div class="cal-err-val" style="color: ${err < 3.0 ? '#3fa84c' : (err < 7.0 ? '#f4b914' : '#e04343')}">${err.toFixed(1)}px</div>
                `;
                row.onclick = () => {
                    if (renderer && renderer.map) {
                        renderer.map.setView([pt.gtaY, pt.gtaX], 4, { animate: true });
                    }
                };
                list.appendChild(row);
            });
        }

        function placeCalMarkers() {
            clearCalMarkers();
            CAL_DATASET.forEach((pt, i) => {
                const icon = L.divIcon({
                    html: `<div style="
                        background:#f4b914; color:#000; font-size:9px; font-weight:800;
                        width:22px; height:22px; border-radius:50%;
                        border:2px solid #101114; display:flex; align-items:center;
                        justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.7);
                    ">${i + 1}</div>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 11],
                    className: '',
                });
                const marker = L.marker([pt.gtaY, pt.gtaX], { icon })
                    .addTo(renderer.map)
                    .bindPopup(`<b>${pt.name}</b><br>GTA: ${pt.gtaX}, ${pt.gtaY}`);
                calMarkers.push(marker);
            });
        }

        function clearCalMarkers() {
            calMarkers.forEach(m => { if (renderer && renderer.map) renderer.map.removeLayer(m); });
            calMarkers = [];
        }

        // Solve Linear Least-Squares to find mathematically optimal CRS parameters
        function solveLeastSquares() {
            let sumX = 0, sumY = 0, sumPxX = 0, sumPxY = 0;
            const N = CAL_DATASET.length;

            CAL_DATASET.forEach(p => {
                sumX += p.gtaX; sumY += p.gtaY;
                sumPxX += p.targetPxX; sumPxY += p.targetPxY;
            });

            const meanX = sumX / N; const meanY = sumY / N;
            const meanPxX = sumPxX / N; const meanPxY = sumPxY / N;

            let numX = 0, denX = 0, numY = 0, denY = 0;
            CAL_DATASET.forEach(p => {
                numX += (p.gtaX - meanX) * (p.targetPxX - meanPxX);
                denX += (p.gtaX - meanX) * (p.gtaX - meanX);
                numY += (p.gtaY - meanY) * (p.targetPxY - meanPxY);
                denY += (p.gtaY - meanY) * (p.gtaY - meanY);
            });

            const optScaleX = numX / denX;
            const optOffsetX = meanPxX - optScaleX * meanX;
            const optScaleY = numY / denY;
            const optOffsetY = meanPxY - optScaleY * meanY;

            document.getElementById('i_sx').value = optScaleX.toFixed(6);
            document.getElementById('i_ox').value = optOffsetX.toFixed(2);
            document.getElementById('i_sy').value = optScaleY.toFixed(6);
            document.getElementById('i_oy').value = optOffsetY.toFixed(2);

            applyCRS();
        }

        function applyCRS() {
            const sx = parseFloat(document.getElementById('i_sx').value);
            const ox = parseFloat(document.getElementById('i_ox').value);
            const sy = parseFloat(document.getElementById('i_sy').value);
            const oy = parseFloat(document.getElementById('i_oy').value);
            if ([sx, ox, sy, oy].some(isNaN)) { alert('Invalid values'); return; }
            window.GTA_MAP_TRANSFORM = { scaleX: sx, offsetX: ox, scaleY: sy, offsetY: oy };
            updateCRSInfo();

            const center = renderer.map.getCenter();
            const zoom = renderer.map.getZoom();
            const style = renderer.style;
            clearCalMarkers();
            renderer.destroy();
            renderer = new DebugRenderer(mapContainer, { style });
            renderer.map.dragging.enable();
            renderer.map.scrollWheelZoom.enable();
            renderer.map.setView(center, zoom, { animate: false });
            if (calVisible) { renderCalList(); placeCalMarkers(); }
        }

        function switchStyle(styleName) {
            document.querySelectorAll('.btn').forEach(b => {
                if (b.textContent === 'Atlas' || b.textContent === 'Grid') {
                    b.classList.toggle('active', b.getAttribute('onclick').includes(styleName));
                }
            });
            const center = renderer.map.getCenter();
            const zoom = renderer.map.getZoom();
            clearCalMarkers();
            renderer.destroy();
            renderer = new DebugRenderer(mapContainer, { style: styleName });
            renderer.map.setView(center, zoom, { animate: false });
            if (calVisible) { renderCalList(); placeCalMarkers(); }
        }

        // Simulate a 5-meter sampled curved route
        function simulateRoute() {
            if (simInterval) { clearInterval(simInterval); simInterval = null; }
            const routePoints = [
                { x: 195.6,  y: -933.9 },
                { x: 215.0,  y: -895.0 },
                { x: 238.0,  y: -850.0 },
                { x: 268.0,  y: -790.0 },
                { x: 292.0,  y: -745.0 },
                { x: 315.0,  y: -700.0 },
                { x: 345.0,  y: -655.0 },
                { x: 370.0,  y: -620.0 },
                { x: 392.0,  y: -570.0 },
                { x: 410.0,  y: -530.0 },
                { x: 422.0,  y: -480.0 },
                { x: 432.0,  y: -440.0 },
                { x: 440.0,  y: -395.0 },
                { x: 448.0,  y: -350.0 },
                { x: 455.0,  y: -305.0 },
                { x: 460.0,  y: -260.0 },
                { x: 467.0,  y: -215.0 },
                { x: 472.0,  y: -170.0 },
                { x: 478.0,  y: -125.0 },
                { x: 483.0,  y:  -80.0 },
                { x: 486.0,  y:  -35.0 },
                { x: 487.7,  y:   10.0 },
            ];
            const dest = { x: 487.7, y: 10.0 };
            let idx = 0;

            renderer.setRoute(routePoints, dest, { x: routePoints[0].x, y: routePoints[0].y, heading: 0 });

            simInterval = setInterval(() => {
                if (idx >= routePoints.length - 1) { clearInterval(simInterval); simInterval = null; return; }
                idx++;
                const remaining = routePoints.slice(idx);
                const player = { x: routePoints[idx].x, y: routePoints[idx].y, heading: 0 };
                if (remaining.length > 1) {
                    renderer.setRoute(remaining, dest, player);
                } else {
                    renderer.setRoute([], null, player);
                }
            }, 600);
        }

        function clearAll() {
            if (simInterval) { clearInterval(simInterval); simInterval = null; }
            if (renderer) renderer.clear();
        }
    </script>
</body>
</html>
