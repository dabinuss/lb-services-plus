<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The hashed JS/CSS filenames change on every build, so once fetched they are safe
    to cache forever. This HTML file itself is not (its URL never changes), so without
    these it can get stuck in the FiveM client's NUI cache pointing at an old build even
    after the server-side files and the resource have been updated. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Services+</title>
    <!-- Poppins (the typeface every native LB Phone app ships with) is self-hosted via
    @font-face in styles.css, not fetched from Google Fonts - FiveM's CEF is not
    guaranteed to have outbound internet access on every server, and a failed external
    fetch would silently fall back to a generic system font. -->
    <script type="module" crossorigin src="./assets/index-BUJX43Zo.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BQur4gap.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
